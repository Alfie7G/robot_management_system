<!-- Ai generated initial html structure, modified each section, 
 including displays, warnings, correctly tuned movement controls, 
 map, status and connection sections were changed to refresh per half second
 so you can see the robots movement and status updates, aswell as whether the connection is still up.
 -->
<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robot Management Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body>
    <main class="container">
        <h1>Robot Management Dashboard</h1>


        <div
            hx-get="/connection"
            hx-trigger="load, every 1s"
            hx-swap="innerHTML">
            <section class="card">
                <h2>Connection</h2>
                <p>Loading connection status...</p>
            </section>
        </div>


        <div
            hx-get="/status"
            hx-trigger="load, every 1s"
            hx-swap="innerHTML">
            <section class="card">
                <h2>Robot Status</h2>
                <p>Loading robot status...</p>
            </section>
        </div>

        <section class="card">
            <h2>Move Robot</h2>
            <form method="post" action="/dashboard/move">
                <label for="x">X Coordinate</label>
                <input type="number" id="x" name="x" min="0" max="20" required>

                <label for="y">Y Coordinate</label>
                <input type="number" id="y" name="y" min="0" max="20" required>

                <button type="submit">Move Robot</button>
            </form>

            <form method="post" action="/dashboard/reset">
                <button class="secondary" type="submit">Reset Simulation</button>
            </form>
        </section>



        <div
            hx-get="/map"
            hx-trigger="load, every 1s"
            hx-swap="innerHTML">
            <section class="card">
                <h2>Map</h2>
                <p>Loading map...</p>
            </section>
        </div>


    </main>
</body>

</html>
